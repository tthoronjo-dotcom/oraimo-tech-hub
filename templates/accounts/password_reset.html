{% extends 'base.html' %}

{% block title %}Reset Password - Oraimo Tech Hub{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="auth-card">
                <h2 class="text-center mb-4 section-title">Reset Password</h2>
                <p style="color: rgba(255,255,255,0.6);">Enter your email address and we'll send you a link to reset your password.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" placeholder="your@email.com" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
                </form>
                <p class="text-center mt-3" style="color: rgba(255,255,255,0.6);">
                    <a href="{% url 'accounts:login' %}">Back to Login</a>
                </p>
            </div>
        </div>
    </div>
</div>

<style>
    .auth-card {
        background: rgba(255,255,255,0.05);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 40px;
        border: 1px solid rgba(255,255,255,0.08);
    }
    .auth-card input {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 10px;
        padding: 10px 15px;
        color: #fff;
        width: 100%;
    }
    .auth-card input:focus {
        border-color: #2ecc71;
        outline: none;
    }
</style>
{% endblock %}
