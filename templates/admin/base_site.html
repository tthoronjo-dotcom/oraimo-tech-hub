{% extends "admin/base.html" %}

{% block title %}{{ title }} | Oraimo Tech Hub Admin{% endblock %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}">
        🛒 Oraimo Tech Hub Admin
    </a>
</h1>
{% endblock %}

{% block extrastyle %}
<style>
    /* ============================================================
       ===== ORAIMO TECH HUB - CUSTOM ADMIN STYLES =====
       ============================================================ */

    /* ----- BODY & BACKGROUND ----- */
    body {
        background: linear-gradient(135deg, #0f0c29, #302b63, #24243e) !important;
        color: #ffffff !important;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
    }

    #container {
        background: transparent !important;
    }

    /* ----- HEADER ----- */
    #header {
        background: linear-gradient(135deg, #1a1a2e, #2d2d2d, #4a1d6d) !important;
        padding: 18px 40px !important;
        border-bottom: 3px solid #2ecc71 !important;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3) !important;
    }

    #branding h1 {
        color: #ffffff !important;
        font-weight: 800 !important;
        font-size: 26px !important;
        letter-spacing: 0.5px !important;
    }

    #branding h1 a {
        color: #ffffff !important;
        text-decoration: none !important;
        display: flex !important;
        align-items: center !important;
        gap: 12px !important;
    }

    #branding h1 a:hover {
        color: #2ecc71 !important;
        transition: color 0.3s ease !important;
    }

    /* ----- USER TOOLS ----- */
    #user-tools {
        color: rgba(255, 255, 255, 0.7) !important;
        font-size: 14px !important;
    }

    #user-tools a {
        color: #54a0ff !important;
        border-bottom: 1px solid transparent !important;
        transition: all 0.3s ease !important;
    }

    #user-tools a:hover {
        color: #2ecc71 !important;
        border-bottom-color: #2ecc71 !important;
    }

    /* ----- CONTENT ----- */
    #content {
        color: #ffffff !important;
        padding: 20px !important;
    }

    #content h1 {
        color: #ffffff !important;
        font-weight: 700 !important;
        border-bottom: 2px solid rgba(46, 204, 113, 0.2) !important;
        padding-bottom: 10px !important;
    }

    /* ----- MODULES (Dashboard Cards) ----- */
    .module {
        background: rgba(255, 255, 255, 0.05) !important;
        backdrop-filter: blur(10px) !important;
        -webkit-backdrop-filter: blur(10px) !important;
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
        border-radius: 16px !important;
        padding: 20px !important;
        margin-bottom: 20px !important;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2) !important;
        transition: all 0.3s ease !important;
    }

    .module:hover {
        box-shadow: 0 12px 48px rgba(0, 0, 0, 0.3) !important;
        border-color: rgba(46, 204, 113, 0.2) !important;
    }

    .module h2, .module caption, .inline-group h2 {
        background: linear-gradient(135deg, #1a1a2e, #4a1d6d) !important;
        color: #ffffff !important;
        border-radius: 10px !important;
        padding: 12px 18px !important;
        font-weight: 700 !important;
        font-size: 16px !important;
        border-left: 4px solid #2ecc71 !important;
    }

    .module th, .module td {
        color: rgba(255, 255, 255, 0.85) !important;
        padding: 10px 12px !important;
    }

    .module th a, .module td a {
        color: #54a0ff !important;
        transition: color 0.3s ease !important;
    }

    .module th a:hover, .module td a:hover {
        color: #2ecc71 !important;
    }

    .module table tr {
        border-bottom: 1px solid rgba(255, 255, 255, 0.06) !important;
    }

    .module table tr:last-child {
        border-bottom: none !important;
    }

    .module table {
        width: 100% !important;
        border-collapse: collapse !important;
    }

    /* ----- LINKS ----- */
    a:link, a:visited {
        color: #54a0ff !important;
        text-decoration: none !important;
        transition: color 0.3s ease !important;
    }

    a:hover {
        color: #2ecc71 !important;
    }

    /* ----- BUTTONS ----- */
    .button, input[type=submit], input[type=button], .submit-row input {
        background: linear-gradient(135deg, #2ecc71, #27ae60) !important;
        color: #ffffff !important;
        border: none !important;
        border-radius: 10px !important;
        padding: 10px 24px !important;
        cursor: pointer !important;
        font-weight: 700 !important;
        font-size: 14px !important;
        transition: all 0.3s ease !important;
        box-shadow: 0 4px 15px rgba(46, 204, 113, 0.2) !important;
    }

    .button:hover, input[type=submit]:hover, input[type=button]:hover {
        background: linear-gradient(135deg, #27ae60, #219a52) !important;
        transform: scale(1.03) !important;
        box-shadow: 0 6px 25px rgba(46, 204, 113, 0.3) !important;
    }

    .button.default {
        background: linear-gradient(135deg, #54a0ff, #00d2d3) !important;
    }

    .button.default:hover {
        background: linear-gradient(135deg, #00d2d3, #54a0ff) !important;
    }

    /* ----- OBJECT TOOLS ----- */
    .object-tools a:link, .object-tools a:visited {
        background: linear-gradient(135deg, #54a0ff, #00d2d3) !important;
        color: #ffffff !important;
        border-radius: 10px !important;
        padding: 8px 18px !important;
        transition: all 0.3s ease !important;
        box-shadow: 0 4px 15px rgba(84, 160, 255, 0.2) !important;
    }

    .object-tools a:hover {
        background: linear-gradient(135deg, #00d2d3, #54a0ff) !important;
        transform: scale(1.05) !important;
    }

    /* ----- BREADCRUMBS ----- */
    .breadcrumbs {
        background: rgba(0, 0, 0, 0.3) !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05) !important;
        padding: 12px 20px !important;
        border-radius: 8px !important;
        margin-bottom: 20px !important;
    }

    .breadcrumbs a {
        color: #54a0ff !important;
    }

    .breadcrumbs a:hover {
        color: #2ecc71 !important;
    }

    .breadcrumbs .current {
        color: rgba(255, 255, 255, 0.5) !important;
    }

    /* ----- MESSAGES ----- */
    .messagelist li {
        border-radius: 10px !important;
        padding: 12px 18px !important;
    }

    .success {
        background: rgba(46, 204, 113, 0.12) !important;
        border: 1px solid rgba(46, 204, 113, 0.25) !important;
        color: #a8e6cf !important;
        border-radius: 10px !important;
    }

    .error, .errornote {
        background: rgba(255, 107, 107, 0.12) !important;
        border: 1px solid rgba(255, 107, 107, 0.25) !important;
        color: #ffa8a8 !important;
        border-radius: 10px !important;
    }

    .warning {
        background: rgba(241, 196, 15, 0.12) !important;
        border: 1px solid rgba(241, 196, 15, 0.25) !important;
        color: #f1c40f !important;
        border-radius: 10px !important;
    }

    /* ----- CHANGELIST FILTER ----- */
    #changelist-filter {
        background: rgba(255, 255, 255, 0.05) !important;
        backdrop-filter: blur(10px) !important;
        -webkit-backdrop-filter: blur(10px) !important;
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
        border-radius: 16px !important;
        padding: 15px !important;
    }

    #changelist-filter h2 {
        background: linear-gradient(135deg, #1a1a2e, #4a1d6d) !important;
        color: #ffffff !important;
        border-radius: 10px !important;
        padding: 10px 15px !important;
        border-left: 4px solid #54a0ff !important;
    }

    #changelist-filter a {
        color: rgba(255, 255, 255, 0.7) !important;
        transition: color 0.3s ease !important;
    }

    #changelist-filter a:hover {
        color: #2ecc71 !important;
    }

    #changelist-filter .selected {
        color: #2ecc71 !important;
        font-weight: 700 !important;
    }

    /* ----- PAGINATOR ----- */
    .paginator {
        color: rgba(255, 255, 255, 0.7) !important;
        padding: 15px 0 !important;
    }

    .paginator a {
        color: #54a0ff !important;
        padding: 5px 12px !important;
        border-radius: 8px !important;
        transition: all 0.3s ease !important;
    }

    .paginator a:hover {
        color: #2ecc71 !important;
        background: rgba(46, 204, 113, 0.1) !important;
    }

    .paginator .this-page {
        background: linear-gradient(135deg, #2ecc71, #27ae60) !important;
        color: #ffffff !important;
        border-radius: 50% !important;
        padding: 5px 12px !important;
        font-weight: 700 !important;
    }

    /* ----- FIELDSETS ----- */
    fieldset {
        background: rgba(255, 255, 255, 0.03) !important;
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
        border-radius: 16px !important;
        padding: 20px !important;
    }

    fieldset h2 {
        background: linear-gradient(135deg, #1a1a2e, #4a1d6d) !important;
        color: #ffffff !important;
        border-radius: 10px !important;
        padding: 10px 18px !important;
        border-left: 4px solid #2ecc71 !important;
    }

    .form-row {
        border-bottom: 1px solid rgba(255, 255, 255, 0.05) !important;
        padding: 12px 0 !important;
    }

    .form-row label {
        color: #ffffff !important;
        font-weight: 500 !important;
    }

    .help {
        color: rgba(255, 255, 255, 0.5) !important;
        font-size: 13px !important;
    }

    /* ----- INPUT FIELDS ----- */
    input, select, textarea {
        background: rgba(255, 255, 255, 0.05) !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        color: #ffffff !important;
        border-radius: 8px !important;
        padding: 8px 12px !important;
        transition: all 0.3s ease !important;
    }

    input:focus, select:focus, textarea:focus {
        border-color: #54a0ff !important;
        box-shadow: 0 0 20px rgba(84, 160, 255, 0.1) !important;
        outline: none !important;
    }

    /* ----- SUBMIT ROW ----- */
    .submit-row {
        background: rgba(255, 255, 255, 0.03) !important;
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
        border-radius: 12px !important;
        padding: 15px !important;
        margin-top: 20px !important;
    }

    /* ----- DARK SCROLLBARS ----- */
    ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
    }

    ::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb {
        background: #2ecc71;
        border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
        background: #27ae60;
    }

    /* ============================================================
       ===== RESPONSIVE =====
       ============================================================ */
    @media (max-width: 768px) {
        #header {
            padding: 12px 20px !important;
        }
        #branding h1 {
            font-size: 18px !important;
        }
        .module {
            padding: 12px !important;
        }
        .module h2 {
            font-size: 14px !important;
        }
        .object-tools a {
            font-size: 12px !important;
            padding: 6px 12px !important;
        }
        .button, input[type=submit], input[type=button] {
            padding: 8px 16px !important;
            font-size: 13px !important;
        }
    }
</style>
{% endblock %}
