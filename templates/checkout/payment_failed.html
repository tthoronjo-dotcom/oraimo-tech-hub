{% extends 'base.html' %}

{% block title %}Payment Failed - Oraimo Tech Hub{% endblock %}

{% block content %}
<div class="container text-center py-5">
    <div style="font-size: 80px;">❌</div>
    <h1 class="mt-3" style="color: #ff6b6b;">Payment Failed</h1>
    <p class="lead">Your payment could not be processed.</p>
    <p style="color: rgba(255,255,255,0.5);">Order ID: {{ order.order_id }}</p>
    
    <div class="mt-4">
        <a href="{% url 'checkout_page' %}" class="btn btn-primary me-2">Try Again</a>
        <a href="{% url 'home' %}" class="btn btn-secondary">Go Home</a>
    </div>
</div>
{% endblock %}
